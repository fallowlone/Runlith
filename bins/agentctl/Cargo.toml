[package]
license = "Apache-2.0"
name = "agentctl"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "agentctl"
path = "src/main.rs"

[[example]]
name = "confirmed-daemon-fixture"
path = "tests/fixtures/confirmed_daemon.rs"
test = false

[dependencies]
bytes = "1"
ipc-contracts = { path = "../../crates/ipc-contracts" }
ipc-control = { path = "../../crates/ipc-control" }
ipc-transport = { path = "../../crates/ipc-transport" }
worker = { path = "../../crates/worker" }
org = { path = "../../crates/org" }
prost = "0.14.4"
tokio = { version = "~1.54", features = ["macros", "rt", "net", "time"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# Hidden terminal input for vault secrets (echo off via termios).
rustix = { version = "1.1.4", features = ["termios", "fs"] }

[dev-dependencies]
agentd = { path = "../agentd", features = ["test-support"] }
agent-runtime = { path = "../../crates/agent-runtime" }
app-services = { path = "../../crates/app-services" }
fake-planner = { path = "../../adapters/fake-planner" }
plan-domain = { path = "../../crates/plan" }
policy = { path = "../../crates/policy" }
workspace = { path = "../../crates/workspace" }
bytes = "1"
ipc-contracts = { path = "../../crates/ipc-contracts" }
ipc-control = { path = "../../crates/ipc-control" }
ipc-transport = { path = "../../crates/ipc-transport" }
worker = { path = "../../crates/worker" }
prost = "0.14.4"
storage-sqlite = { path = "../../adapters/storage-sqlite" }
task-domain = { path = "../../crates/task" }
tempfile = "3"
tokio = { version = "~1.54", features = ["macros", "rt", "net", "time"] }
