[package]
license = "Apache-2.0"
name = "agentd"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "agentd"
path = "src/main.rs"

[features]
test-support = []

[dependencies]
agent-runtime = { path = "../../crates/agent-runtime" }
app-services = { path = "../../crates/app-services" }
bytes = "1"
evaluation = { path = "../../crates/evaluation" }
effect-capture-local = { path = "../../adapters/effect-capture-local" }
finder-local = { path = "../../adapters/finder-local" }
git-cli = { path = "../../adapters/git-cli" }
repo-finder = { path = "../../crates/repo-finder" }
ipc-contracts = { path = "../../crates/ipc-contracts" }
ipc-control = { path = "../../crates/ipc-control" }
ipc-transport = { path = "../../crates/ipc-transport" }
memory = { path = "../../crates/memory" }
background = { path = "../../crates/background" }
worker = { path = "../../crates/worker" }
org = { path = "../../crates/org" }
widget-spec = { path = "../../crates/widget-spec" }
provider-claude = { path = "../../adapters/provider-claude" }
policy = { path = "../../crates/policy" }
plan-domain = { path = "../../crates/plan" }
runner = { path = "../../crates/runner" }
runner-native = { path = "../../adapters/runner-native" }
runner-macos-seatbelt = { path = "../../adapters/runner-macos-seatbelt" }
scheduler = { path = "../../crates/scheduler" }
secrets = { path = "../../crates/secrets" }
secrets-vault = { path = "../../adapters/secrets-vault" }
storage-sqlite = { path = "../../adapters/storage-sqlite" }
task-domain = { path = "../../crates/task" }
tokio = { version = "~1.54", features = ["macros", "rt", "net", "sync", "time"] }
workspace = { path = "../../crates/workspace" }
zeroize = "1"
prost = "0.14.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
getrandom = "0.4.3"
libc = "0.2"
sha2 = "0.11"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
app-services = { path = "../../crates/app-services" }
agent-runtime = { path = "../../crates/agent-runtime" }
bytes = "1"
fake-evaluator = { path = "../../adapters/fake-evaluator" }
fake-planner = { path = "../../adapters/fake-planner" }
finder-local = { path = "../../adapters/finder-local" }
git-cli = { path = "../../adapters/git-cli" }
provider-claude = { path = "../../adapters/provider-claude", features = ["trusted-host"] }
repo-finder = { path = "../../crates/repo-finder" }
repo-finder-contract = { path = "../../crates/repo-finder-contract" }
secrets-vault = { path = "../../adapters/secrets-vault", features = ["test-params"] }
storage-sqlite = { path = "../../adapters/storage-sqlite" }
task-domain = { path = "../../crates/task" }
tempfile = "3"
tokio = { version = "~1.54", features = ["macros", "rt", "net", "sync", "time"] }
workspace = { path = "../../crates/workspace" }
