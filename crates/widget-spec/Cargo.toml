[package]
name = "widget-spec"
version = "0.1.0"
edition = "2021"
description = "Versioned widget and dashboard format: data only, closed validation, no I/O"

[lib]
name = "widget_spec"
path = "src/lib.rs"

[features]
# TypeScript bindings for the desktop app only; the core workspace never enables it.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", optional = true }
