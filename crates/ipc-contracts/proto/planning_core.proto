syntax = "proto3";

package ai_engineering_os.ipc;

// G7 planning control plane (protocol v5).  This envelope requests trusted
// application-service operations.  It deliberately carries no PlanRevision,
// graph, approval grant, provider identity, or durable state transition.
import "task_core.proto";

message PlanningContext {
  string task_id = 1;
  string plan_branch_id = 2;
  // Historical protocol-v5 fields. They remain on the wire for decode
  // compatibility only; agentd ignores them and re-derives authority from
  // canonical Task + Policy state.
  repeated string scope_roots = 3;
  repeated string acceptance_criterion_ids = 4;
  string policy_fingerprint = 5;
  string evidence_ref = 6;
}

message TriggerPlanningRequest {
  PlanningContext context = 1;
}

message ApplyHumanContinuationRequest {
  string request_id = 1;
  // Historical protocol-v5 context. Kept for decode compatibility only.
  // Current agentd re-derives Task/branch/Policy authority from the durable
  // HumanDecisionRequest and canonical product state.
  optional PlanningContext context = 2;
}

message PlanningOperationResponse {
  string outcome = 1;
  optional string plan_branch_id = 2;
  optional uint64 revision_seq = 3;
  optional string human_decision_request_id = 4;
  string detail = 5;
}

message PlanningCoreRequest {
  oneof payload {
    TriggerPlanningRequest trigger = 1;
    ApplyHumanContinuationRequest apply_human_continuation = 2;
  }
}

message PlanningCoreResponse {
  oneof payload {
    PlanningOperationResponse operation = 1;
    BusinessError error = 2;
  }
}
