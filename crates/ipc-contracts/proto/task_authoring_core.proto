syntax = "proto3";

package ai_engineering_os.ipc;

// Task authoring and explicit owner policy selection (protocol v6).
//
// Creates a DRAFT Task with trusted planning metadata, or selects the
// append-only TestMutationPolicy revision for an existing DRAFT Task. Policy
// selection is a separate owner command and never a Task DTO field.
//
// Authority rules:
// - The historical protocol-v1 `CreateTaskRequest` is unchanged; these are
//   separate v6-only operations, so a v0-v5 session cannot author metadata or
//   select an exception to the trusted Forbidden policy.
// - The client never supplies event ids, timestamps, provenance, lifecycle
//   state, Policy fingerprints, planning snapshots, Plan branches or graphs.
// - Planning intent has no later edit operation. Policy selection can append
//   revisions only while the Task remains DRAFT and before execution begins.
import "task_core.proto";

message CreatePlanningTaskRequest {
  string id = 1;
  string project_id = 2;
  string objective = 3;
  // Scope roots in `workspace:relative/path` form.
  repeated string allowed_paths = 4;
  // Acceptance obligation identities.
  repeated string acceptance_criteria = 5;
  // One of `low`, `medium`, `high`, `critical`.
  string baseline_risk = 6;
}

// Canonical committed view: the stored Task plus the planning metadata the
// server persisted (trimmed and de-duplicated).
message PlanningTaskDto {
  TaskDto task = 1;
  repeated string allowed_paths = 2;
  repeated string acceptance_criteria = 3;
  string baseline_risk = 4;
}

message CreatePlanningTaskResponse {
  PlanningTaskDto task = 1;
}

enum TestMutationPolicyKind {
  TEST_MUTATION_POLICY_KIND_UNSPECIFIED = 0;
  FORBIDDEN = 1;
  SCOPED_REVIEWED = 2;
}

// Separate owner-authored policy command. It is never a Task DTO field and
// is accepted only on authenticated local control-plane sessions (protocol v6).
message SelectTestMutationPolicyRequest {
  string task_id = 1;
  TestMutationPolicyKind kind = 2;
  repeated string exact_paths = 3;
  repeated string exact_checks = 4;
}

message SelectTestMutationPolicyResponse {
  uint64 revision = 1;
  string fingerprint = 2;
}

message TaskAuthoringCoreRequest {
  oneof payload {
    CreatePlanningTaskRequest create_planning_task = 1;
    SelectTestMutationPolicyRequest select_test_mutation_policy = 2;
  }
}

message TaskAuthoringCoreResponse {
  oneof payload {
    CreatePlanningTaskResponse create_planning_task = 1;
    BusinessError error = 2;
    SelectTestMutationPolicyResponse select_test_mutation_policy = 3;
  }
}
