[package]
license = "Apache-2.0"
name = "app-services"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_services"
path = "src/lib.rs"

[dependencies]
continuity = { path = "../continuity" }
context-engine = { path = "../context-engine" }
task-domain = { path = "../task" }
agent-runtime = { path = "../agent-runtime" }
workspace = { path = "../workspace" }
storage-sqlite = { path = "../../adapters/storage-sqlite" }
scheduler = { path = "../scheduler" }
evaluation = { path = "../evaluation" }
policy = { path = "../policy" }
runner = { path = "../runner" }
plan-domain = { path = "../plan" }
takeover = { path = "../takeover" }
security-audit = { path = "../security-audit" }
secrets = { path = "../secrets" }
sha2 = "0.10"
repo-finder = { path = "../repo-finder" }

[dev-dependencies]
fake-agent = { path = "../../adapters/fake-agent" }
fake-planner = { path = "../../adapters/fake-planner" }
fake-evaluator = { path = "../../adapters/fake-evaluator" }
git-cli = { path = "../../adapters/git-cli" }
provider-claude = { path = "../../adapters/provider-claude", features = ["trusted-host"] }
runner-native = { path = "../../adapters/runner-native" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
