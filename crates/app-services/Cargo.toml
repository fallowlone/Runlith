[package]
name = "app-services"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_services"
path = "src/lib.rs"

[dependencies]
task-domain = { path = "../task" }
agent-runtime = { path = "../agent-runtime" }
workspace = { path = "../workspace" }
storage-sqlite = { path = "../../adapters/storage-sqlite" }
scheduler = { path = "../scheduler" }
evaluation = { path = "../evaluation" }
policy = { path = "../policy" }
sha2 = "0.10"

[dev-dependencies]
fake-agent = { path = "../../adapters/fake-agent" }
fake-evaluator = { path = "../../adapters/fake-evaluator" }
git-cli = { path = "../../adapters/git-cli" }
provider-claude = { path = "../../adapters/provider-claude" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
