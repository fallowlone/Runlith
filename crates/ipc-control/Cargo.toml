[package]
name = "ipc-control"
version = "0.1.0"
edition = "2021"

[lib]
name = "ipc_control"
path = "src/lib.rs"

[dependencies]
bytes = "1"
ipc-contracts = { path = "../ipc-contracts" }
ipc-transport = { path = "../ipc-transport" }
prost = "0.14.4"
tokio = { version = "~1.51", features = ["time"] }

[dev-dependencies]
tokio = { version = "~1.51", features = ["macros", "rt", "time"] }
