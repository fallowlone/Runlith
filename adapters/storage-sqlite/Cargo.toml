[package]
license = "Apache-2.0"
name = "storage-sqlite"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "storage_sqlite"
path = "src/lib.rs"

[features]
# Tamper-test fixtures (reseal_journal_chain). Never enabled by default.
test-support = []

[dependencies]
continuity = { path = "../../crates/continuity" }
context-engine = { path = "../../crates/context-engine" }
task-domain = { path = "../../crates/task" }
agent-runtime = { path = "../../crates/agent-runtime" }
workspace = { path = "../../crates/workspace" }
secrets = { path = "../../crates/secrets" }
security-audit = { path = "../../crates/security-audit" }
plan-domain = { path = "../../crates/plan" }
takeover = { path = "../../crates/takeover" }
memory = { path = "../../crates/memory" }
background = { path = "../../crates/background" }
worker = { path = "../../crates/worker" }
org = { path = "../../crates/org" }
evaluation = { path = "../../crates/evaluation" }
policy = { path = "../../crates/policy" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
# Self dev-dependency enables test-support for this crate's integration tests only.
storage-sqlite = { path = ".", features = ["test-support"] }
continuity-contract = { path = "../../crates/continuity-contract" }
memory-contract = { path = "../../crates/memory-contract" }
background-contract = { path = "../../crates/background-contract" }
worker-contract = { path = "../../crates/worker-contract" }
org-contract = { path = "../../crates/org-contract" }
context-engine-contract = { path = "../../crates/context-engine-contract" }
policy = { path = "../../crates/policy" }
# Raw-SQL probes for trigger/migration guarantees (TASK-0151): no public
# API exposes DDL or row deletion, so SQL-level tests open the database
# file directly. Test-only; same pinned rusqlite as the library.
rusqlite = { version = "0.41.1", features = ["bundled"] }
