[package]
name = "storage-sqlite"
version = "0.1.0"
edition = "2021"

[lib]
name = "storage_sqlite"
path = "src/lib.rs"

[dependencies]
task-domain = { path = "../../crates/task" }
agent-runtime = { path = "../../crates/agent-runtime" }
workspace = { path = "../../crates/workspace" }
secrets = { path = "../../crates/secrets" }
security-audit = { path = "../../crates/security-audit" }
plan-domain = { path = "../../crates/plan" }
evaluation = { path = "../../crates/evaluation" }
policy = { path = "../../crates/policy" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
policy = { path = "../../crates/policy" }
# Raw-SQL probes for trigger/migration guarantees (TASK-0151): no public
# API exposes DDL or row deletion, so SQL-level tests open the database
# file directly. Test-only; same pinned rusqlite as the library.
rusqlite = { version = "0.40.2", features = ["bundled"] }
