[package]
license = "Apache-2.0"
name = "secrets-vault"
version = "0.1.0"
edition = "2021"

[lib]
name = "secrets_vault"
path = "src/lib.rs"

[features]
# Exposes `VaultBackend::create_with_test_params` (cheap, insecure KDF
# parameters) to tests of composing crates. Never enabled for a release.
test-params = []

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
secrets = { path = "../../crates/secrets" }
zeroize = "1"

[dev-dependencies]
secret-backend-contract = { path = "../../crates/secret-backend-contract" }
sha2 = "0.11.0"
tempfile = "3"
