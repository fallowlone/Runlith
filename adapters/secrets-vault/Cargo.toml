[package]
name = "secrets-vault"
version = "0.1.0"
edition = "2021"

[lib]
name = "secrets_vault"
path = "src/lib.rs"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
secrets = { path = "../../crates/secrets" }
zeroize = "1"

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3"
