[package]
name = "provider-claude"
version = "0.1.0"
edition = "2021"

[lib]
name = "provider_claude"
path = "src/lib.rs"

[features]
# F6: the unmanaged trusted-host constructors (no Runner sandbox) exist only
# for contract fixtures. Production builds never enable this; tests do via
# the dev-dependencies below.
trusted-host = []

[dependencies]
agent-runtime = { path = "../../crates/agent-runtime" }
task-domain = { path = "../../crates/task" }
scheduler = { path = "../../crates/scheduler" }
workspace = { path = "../../crates/workspace" }
runner = { path = "../../crates/runner" }
evaluation = { path = "../../crates/evaluation" }
plan-domain = { path = "../../crates/plan" }

[dev-dependencies]
execution-contract = { path = "../../crates/execution-contract" }
planner-contract = { path = "../../crates/planner-contract" }
provider-claude = { path = ".", features = ["trusted-host"] }
