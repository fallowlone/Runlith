[package]
name = "finder-local"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "finder_local"
path = "src/lib.rs"

[dependencies]
repo-finder = { path = "../../crates/repo-finder" }
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
repo-finder-contract = { path = "../../crates/repo-finder-contract" }
