<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Runlith</title>
  <desc id="d">Runlith: a local-first control plane for durable AI-assisted software engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#151b2e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf5c4"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ecf8"/>
      <stop offset="1" stop-color="#9fb4ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- monolith mark: a stone (lith) cut by a run-line -->
  <g transform="translate(170 60)">
    <path d="M60 0 L120 34 L120 130 L60 200 L0 130 L0 34 Z" fill="none" stroke="url(#mark)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M60 0 L60 200" stroke="url(#mark)" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M0 34 L60 68 L120 34" fill="none" stroke="url(#mark)" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 118 H52 L66 92 L82 140 L94 118 H110" fill="none" stroke="#7cf5c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="118" r="6" fill="#7cf5c4"/>
  </g>

  <text x="340" y="170" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" letter-spacing="-3" fill="url(#word)">Runlith</text>
  <text x="344" y="218" font-family="'SF Mono','JetBrains Mono',Menlo,monospace" font-size="22" fill="#8c97b8">durable AI engineering, on your machine.</text>

  <g font-family="'SF Mono','JetBrains Mono',Menlo,monospace" font-size="15" fill="#5b8cff" fill-opacity="0.9">
    <text x="344" y="262">task → plan → execute → verify → ship</text>
  </g>
</svg>
