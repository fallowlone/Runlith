[package]
name = "runlith-desktop"
version = "0.1.0"
description = "Runlith desktop shell (design implementation). Tauri is a thin native shell; all business logic stays in agentd (ADR-0007)."
edition = "2021"

# Standalone crate on purpose: the repository root workspace is
# architecture-governed; a UI shell crate must not silently join it.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
