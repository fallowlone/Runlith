  - id: TASK-0153
    gate: G8
    title: Propose Apache License, Version 2.0 repository licensing (ADR-0038)
    objective: >-
      Rework ADR-0038 (Proposed) changing the repository default license from
      Apache Shield 1.0.0 to Apache License, Version 2.0 (Apache-2.0), with an
      License Grant limiting free production use to individuals'
      personal open-source use and to charitable/privately-operated
      not-for-profit educational or research institutions, so that any other
      production use (any business; any government body or
      government-operated institution, including public schools and public
      universities; any freelancer/contractor acting commercially) requires a
      separately executed commercial license, while non-production use
      (evaluating or testing Runlith, and developing or debugging Runlith
      itself) remains free for everyone under the License's own base grant;
      each version converts to Apache License 2.0
      four years after its first public distribution; the core stays
      described as open source, never open source; apply the
      corresponding LICENSE, NOTICE, LICENSE, README.md, monetization-doc
      and ADR-index changes, all pending owner ratification.
    scope: >-
      Docs/licensing/governance only; no code, no product/version.toml, no
      Cargo manifest change. LICENSE replaced with the verbatim Apache-2.0 1.1
      license body plus the license's own permitted Parameters; NOTICE
      rewritten for Apache-2.0; LICENSE rewritten for the new model; README.md
      License section updated; targeted edits to
      AI_ENGINEERING_OS_MONETIZATION_AND_PLUGIN_ECOSYSTEM.md §2.1, §2.2, §3
      tier table and §3.1-§3.5 wording only; ADR renamed to
      docs/architecture/adr/ADR-0038-product-licensing.md and rewritten
      for Apache-2.0; ADR index updated with a Proposed row. No license-enforcement
      or phone-home mechanism is authorized (ADR-0014 preserved).
    exit_criteria_summary: >-
      (1) Content: ADR-0038 exists at
      docs/architecture/adr/ADR-0038-product-licensing.md and contains at
      minimum Context/Decision/Alternatives/Consequences/Security
      impact/Migration impact per AGENT.md §11; LICENSE's license body (from
      "Terms" through the terms of the License) is byte-identical to
      upstream Apache-2.0 1.1 (SPDX `Apache-2.0`) with only the permitted Parameters
      filled in; NOTICE carries plain-text copyright and Apache-2.0
      licensing-summary lines; LICENSE, README.md and the monetization
      doc's targeted sections (§2.1, §2.2, §3 tier table, §3.1-§3.5) are
      consistent with the Apache-2.0 model, stating plainly that non-production use
      is free for everyone and that free production use is limited to the
      License Grant; ADR-0038 is linked from
      docs/architecture/adr/INDEX.md under its new path.
      (2) Status gate: ADR-0038 remains Status Proposed until the owner
      ratifies it, and owner ratification happens only after an independent
      architecture/governance review returns PASS; only ratification may
      change the ADR's status to Accepted.
