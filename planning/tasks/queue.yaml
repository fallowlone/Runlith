      --all-targets -D warnings and the workspace test suite on push to main
      and on pull request; its assertions match what is reproducibly green
      locally, with real-provider smokes left ignored; the toolchain is pinned;
      the platform coverage it does and does not provide is stated explicitly
      rather than implied.
    outcome: >-
      ACCEPTED after one REQUEST_CHANGES round.
      .github/workflows/verification.yml runs cargo fmt --all --check, cargo
      clippy --workspace --all-targets --locked -D warnings and cargo test
      --workspace --locked --no-fail-fast on push to main and on pull request
      against main, on macos-latest, with the toolchain pinned to 1.95.0
      because the workspace declares neither a rust-toolchain file nor an MSRV.
      All three were reproduced green on the committed tree, not only on the
      baseline: fmt clean, clippy clean, cargo test --workspace 1097 passed /
      3 ignored. The three ignored are the real-provider smokes, which need
      RUNLITH_CLAUDE_SMOKE=1 and an authenticated Claude CLI; they stay
      ignored on a runner and the workflow does not pretend otherwise.
      What this does NOT do, which the first submission failed to state and
      independent review blocked on: the workflow gates nothing. No required
      status check is configured by this change, and none can be configured
      from repository content at all; whether any branch protection exists on
      the remote was not verifiable from here, so nothing should be assumed
      either way. On the evidence available, no merge is blocked by a red run.
      It reports after the fact on whatever tip was pushed. Because merges land
      locally in worktrees and pushes are batched (origin/main was 18 commits
      behind local main when this was written), one run can cover many
      accepted merges and a failure cannot be attributed to a single task.
      Acceptance therefore still rests on the operator's local run at the
      moment it is made; this is a second opinion, not a gate. Per-merge
      verification needs each accepted merge pushed, plus branch protection
      configured outside the repository.
      Two further limits are recorded rather than implied. The workflow has
      never executed: GitHub Actions cannot be run locally against a macOS
      runner, so its YAML was validated by parse and its commands by local
      reproduction, and the first push to origin is what proves it green; the
      likeliest avoidable first-run failure is the runner image not shipping
      rustup, which was not verifiable without network access. And the queue's
      own precedent (TASK-0099) required three to four consecutive full-suite
      runs on a process-and-socket-heavy suite with two historically named
      flakes, while this job runs the suite once — so a green run is weaker
      evidence of determinism than the local practice it supplements.
      Supply chain: one GitHub-owned action, no cache action, no third-party
      action, no secrets, permissions contents:read, correct pull_request
      (not pull_request_target) trigger, and no workflow input interpolated
      into any shell command. actions/checkout is pinned to the mutable @v4
      tag rather than a commit SHA because this change was authored without
      network access to resolve one, and persist-credentials is disabled so
      the job keeps no git credential while running repository-authored code.
      The runner image label is likewise left mutable on purpose, since an
      unverifiable label is the likeliest way to make the first run red; both
      pins are worth revisiting once a known-green run exists.
      Platform coverage is stated in the job comment rather than implied:
      macOS Seatbelt is the only mandatory-confinement backend, so this proves
      the supported platform only, and the non-macOS cfg arm in
      bins/agentd/src/execution.rs stays verified by inspection until a second
      runner job exists — the evidence TASK-0117 named as outstanding.
      completed_through remains TASK-0115 because TASK-0116 (G7-BLOCKER-05 /
      F-07) is still open; product identity advances to TASK-0118 and G7
      remains IN_PROGRESS.
