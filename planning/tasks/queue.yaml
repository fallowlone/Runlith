  - id: TASK-0101
    gate: G7
    title: Provider Authentication Environment and Smoke Evidence Integrity
    objective: Restore provider-owned authentication inside the sanitized child
      environment, and stop both real-provider smokes from reporting success
      when the real call never succeeded.
    scope: >-
      The child-environment allowlists on both sides of the Runner seam and the
      failure-tolerance policy of the two real-provider smokes. No change to
      the sandbox profile: the seatbelt capability the same authentication also
      needs is TASK-0102.
    exit_criteria_summary: >-
      The governed child carries the login principal, the provider smoke
      reaches its marker assertion against the real CLI, and neither smoke can
      pass on an unexplained failure.
    outcome: >-
      FIXED, in two of three parts. The defect was found by executing the
      OS-level verification envelope the owner settled for G7, and it is
      exactly the class that envelope existed to catch. `ProviderEnvironment`
      requires HOME "for provider-owned authentication", but neither its own
      allowlist nor the Runner's CHILD_ENV_ALLOWLIST carried USER, and the
      claude CLI resolves its stored credentials through the POSIX login
      principal. Measured on a cleared environment: PATH+HOME gives "Not logged
      in" and exit 1 with empty stderr; adding USER alone succeeds; LOGNAME
      alone does not. Both allowlists now carry it, and the adapter fails
      closed when it is absent on unix, as it already did for HOME. USER
      carries no credential material and is implied by HOME's path, so the
      child environment is not widened. The evidence chain mattered more than
      the fix. Both smokes tolerated any failure; the G6 smoke went further and
      asserted `detail.contains("unrecognized_model")`, making a stale model
      pin in the developer's own CLI config the pass condition. It reported
      success across the G5 and G6 closures while the real call never once
      succeeded, and G6_FINAL_CLOSURE_REAUDIT recorded that pass as envelope
      evidence. Both now tolerate only named environment facts (quota, rate
      limit, network, timeout) and fail on everything else, including an exit
      carrying no diagnostic. The provider smoke now reaches its marker
      assertion against the real CLI for the first time in the chain
      (G5_SMOKE_OK, 3.6s, real session id). The G6 seatbelt smoke correctly
      fails: provider-owned authentication also needs mach-lookup of
      com.apple.SecurityServer, which the sandbox denies. That widening is an
      owner decision and is TASK-0102, not smuggled in here. Verification:
      1082 passed, 0 failed, 2 ignored on the branch; two consecutive
      post-merge runs on main at cargo exit 0 with no `test result: FAILED`.
    depends_on:
      - TASK-0100
    blocked_by: []
    references:
      - adapters/provider-claude/src/environment.rs
      - crates/runner/src/lib.rs

  - id: TASK-0103
    gate: G7
    title: Provider Authentication Boundary Study
    objective: Answer, from external evidence, whether comparable orchestrators
      widen the sandbox to reach platform credentials or move the
      authentication boundary out of it.
    scope: >-
      One cross-product study under external-research/studies/ and the README
      layout line that introduces that directory. No code, no contract, no
      adoption beyond the recorded decisions.
    exit_criteria_summary: >-
      The study exists with its evidence level stated, classifies each finding
      by the directory's method, and records an adoption decision including
      what is explicitly not adopted.
    outcome: >-
      RECORDED. Five sources — the ACP specification, Zed, Cline, OpenCode and
      ZCode — converge: the orchestrator never owns provider authentication,
      the agent process does, and authentication is a separate interactive
      phase with a human present. ACP makes it protocol state: authMethods at
      initialize, a typed auth_required error, and a terminal method whose
      flow is a separate interactive launch of the same agent program,
      deliberately not the working connection. No reviewed system sandboxes an
      interactive login; none grants a worker credential-store access so it can
      log itself in. That explains TASK-0102: it was not one primitive short,
      it was asking a confined non-interactive worker to perform an act every
      reviewed system treats as interactive and human-present. The
      differentiation test passes rather than dilutes — Cline and Zed never met
      this defect because they do not sandbox the provider at all, so Runlith
      is the only one that needs the login/work split to be explicit, and
      adopting it keeps the sandbox tight. Adopted: F-1 enforced boundary, F-2
      typed ProviderAuthenticationRequired, F-3 adapted as a verified
      precondition since Runlith has no terminal to present. Rejected pending
      primary-source verification: F-5, a compliance boundary asserted by a
      competitor's documentation that contradicts itself on the same page, and
      which rules out the file-based-OAuth sketch floated during TASK-0102
      until checked. Evidence is documentation-level, not source-level, and the
      study states that limitation before its findings.
    depends_on:
      - TASK-0101
    blocked_by: []
    references:
      - external-research/studies/2026-09-19-provider-authentication-boundary.md

  - id: TASK-0102
    gate: G7
    title: Seatbelt Platform Credential Capability
    objective: Grant the sandboxed provider child access to the macOS platform
      credential store, so provider-owned authentication works inside the
      production isolation profile.
    scope: >-
      The Seatbelt profile and the vocabulary needed to declare the grant.
      Superseded before merge by TASK-0103; nothing from this branch is on
      main.
    exit_criteria_summary: >-
      The G6 real-provider smoke passes inside the production sandbox without
      weakening any other isolation guarantee.
    outcome: >-
      NOT ADOPTED. Implemented on branch
      task-0102-seatbelt-authentication-capability (9a4a292), never merged,
      branch kept as the record. The work stands as measurement, not as
      product. Measured on the review host: granting mach-lookup of
      com.apple.SecurityServer is necessary — under a permissive profile it is
      exactly the difference between "Not logged in" and a successful call —
      but it is not sufficient. Under a production-shaped profile
      authentication still fails unless process-exec is also unrestricted, and
      process-exec restricted to the exact authorized binary is one of G6's
      core guarantees. Ruled out by direct probe as the missing piece: Keychain
      file paths, wide network, process-info* both on self and unrestricted,
      process-codesigning-status-get, and exec paths /usr, /bin, /sbin,
      /System and $HOME/.local. The remaining primitive was never identified,
      and the search was stopped deliberately once its cost exceeded its value.
      TASK-0103 then explained why it ran out of road: this direction asked a
      confined non-interactive worker to perform an act that every reviewed
      external system treats as a separate interactive phase with a human
      present. The branch's SupportService vocabulary is also not salvaged.
      PlatformCredentials was its only variant, so keeping the enum without it
      would leave a variant-less abstraction plus dead plumbing through agentd
      and the backend — speculative generality the coding rules forbid. It can
      be reconstructed from this branch if a real second user ever appears.
      The succeeding work is TASK-0104, which moves the boundary instead of
      widening it.
    depends_on:
      - TASK-0103
    blocked_by: []
    references:
      - external-research/studies/2026-09-19-provider-authentication-boundary.md
      - adapters/runner-macos-seatbelt/src/lib.rs

  - id: TASK-0104
    gate: G7
    title: Provider Authentication Precondition
    objective: Resolve the providers.md open item on provider auth-state
      detection semantics, and make an unauthenticated provider a named
      refusal instead of an opaque exit.
    scope: >-
      The providers.md contract amendment, a bounded authentication probe in
      the Claude adapter, and its enforcement in the shared provider launch
      preparation. No sandbox profile change: the confined-child credential
      problem stays TASK-0102 and unsolved.
    exit_criteria_summary: >-
      The contract defines authentication state distinctly from availability,
      the probe implements that vocabulary under the detection discipline, and
      a provider recognized as real is refused before launch when not signed
      in.
    outcome: >-
      DONE, contract first. Investigation found an accepted decision pointing
      the other way — detect() and providers.md §2 state that auth is
      deliberately not probed and AUTH_REQUIRED deliberately absent from §9 —
      while §16 simultaneously listed provider auth-state detection semantics
      as an open item. The task therefore resolves a named open question
      rather than overturning a settled one. The original reasoning is kept:
      installation and version compatibility are installation facts, being
      signed in is not, so §9 remains closed and untouched. Only its second
      premise died, that auth cannot be observed without burning quota or
      risking a prompt; `claude auth status` answers from local state at no
      cost. New §9a carries its own closed vocabulary, with UNKNOWN refusing
      like UNAUTHENTICATED because an unestablished state is not consent, and
      the rule that the runtime never performs a login itself. The probe reads
      only the loggedIn boolean and a test asserts account identifiers from
      real output never reach the operator-facing detail or refusal text.
      Enforcement is gated on detect() reporting AVAILABLE, so only a provider
      recognized as the real compatible CLI is asked; that gate was found the
      hard way, by an unconditional placement that refused deterministic
      fixtures and broke 29 tests across 7 suites, which was reverted and
      recorded as open before the owner chose this resolution. Two honesty
      items are written into the contract rather than left implicit: §9a
      states the precondition observes the operator's host state and cannot
      promise a confined child can authenticate, and §15 now names USER
      alongside HOME as the authentication anchor, reconciling a staleness
      this orchestrator introduced in TASK-0101 by changing code without the
      contract. Verification: two consecutive full workspace runs at cargo
      exit 0, the second on a cleaned process table; clippy and fmt clean; the
      G6 real-provider smoke run explicitly to prove the gate admits rather
      than blocks a real authenticated CLI, its unchanged failure remaining
      the TASK-0102 isolation issue.
    depends_on:
      - TASK-0103
    blocked_by: []
    references:
      - docs/architecture/providers.md
      - adapters/provider-claude/src/authentication.rs

  - id: TASK-0105
    gate: G7
    title: IPC Admission Test Hardening
    objective: Fix G5 TEST-H2 structurally, so the IPC capacity test stops
      asserting an instantaneous value of an asynchronous counter it does not
      control.
    scope: >-
      The capacity test and one non-panicking admission helper in
      bins/agentd/src/lib.rs. No product behaviour change: admission was
      already correct under both refusal mechanisms.
    exit_criteria_summary: >-
      The test asserts the admission bound rather than exact occupancy, and an
      A/B against a reproducing control shows the flake gone.
    outcome: >-
      FIXED, and the original diagnosis corrected. G5 attributed TEST-H2 to a
      saturating transport_connect refused by the kernel. That is one
      instance, not the cause: the failure observed here landed on
      perform_handshake inside admin_session, meaning the connection was
      accepted and then closed mid-handshake. The shared root is that
      admission is a semaphore whose permit returns when the daemon's
      connection task ends, asynchronously with the client dropping its side,
      so a test holding exactly MAX_CONTROL_CLIENTS sessions asserts an
      instantaneous value of someone else's counter and cannot control it by
      construction. The earlier hardening in wait_ready_session removed one
      instance of the race and left the assumption, which is why it returned.
      The test now saturates by observation — admit until one client is
      refused, guaranteed within MAX_CONTROL_CLIENTS + 1 attempts against a
      bound of MAX_CONTROL_CLIENTS, so it terminates without a timeout and
      depends on no permit timing. It asserts the contract: a refusal occurs
      within the bound, ready sessions never exceed it, and the refusal harms
      neither an existing session nor the daemon. Kernel refusal and daemon
      refusal are treated as the single fact the contract cares about.
      Evidence is an A/B with a reproducing control on one machine in one
      window: ten runs of `-p agentd --lib` on main with the old test failed
      2 of 10, matching the rate G5 measured; ten runs on this branch failed
      0 of 10; three full workspace runs failed 0 of 3. Renamed to match what
      it proves, with the former name and the TEST-H2 reference kept in the
      doc comment so the audit trail does not dangle. Still open and
      unreproduced: a single app-services workspace_service failure seen once
      during TASK-0104 post-merge whose test name was never captured; it did
      not recur in any run of this task.
    depends_on:
      - TASK-0104
    blocked_by: []
    references:
      - bins/agentd/src/lib.rs
      - docs/development/G5_FINAL_CLOSURE_AUDIT.md

  - id: TASK-0106
    gate: G7
    title: Real-Provider Planner Smoke
    objective: Execute the G7 planning capability against the real Claude CLI
      once, end to end, so the gate's own path has a real test.
    scope: >-
      One ignored, env-gated integration test. No production change.
    exit_criteria_summary: >-
      A test drives the real CLI through ClaudePlanner and PlanningService to
      a durable plan revision, and what may make it pass is constrained so a
      tolerated failure cannot be mistaken for a success.
    outcome: >-
      BUILT, and RED on first contact — which is its result, not its failure.
      The chosen G7 closure envelope had named this test and never built it:
      both the adapter contract suite and the claude_fixture harness in
      planning_service.rs substitute a shell script for the CLI, so real CLI
      -> provider parsing -> PlanChangeSet -> durable revision had never
      executed. The harness was verified against a hand-built known-good
      proposal before its verdict was trusted, reaching Accepted with durable
      head 1, so a real-CLI failure is a statement about the provider path
      rather than about the test. Three runs against the authenticated CLI
      failed identically. The pass conditions are deliberately narrow after
      TASK-0101: absence of a CLI, of availability or of authentication
      returns early because those are absences of an environment rather than
      results; quota, rate-limit, network and timeout pass through named;
