  - id: TASK-0112
    gate: G7
    title: Production Sandbox Provider Authentication Diagnosis
    objective: >-
      Determine exactly why an authenticated Claude CLI succeeds at the host
      boundary but cannot use the same established authentication state when
      launched through the production macOS Seatbelt profile.
    scope: >-
      Diagnosis only: environment propagation, HOME/USER anchoring,
      subprocess execution, filesystem reads, Keychain/SecurityServer and
      other observed Mach or OS-service requests. Compare host, minimally
      sanitized, permissive-sandbox and production-shaped execution. Do not
      widen production sandbox authority, run provider login, or read
      credential contents.
    exit_criteria_summary: >-
      Produce a measured boundary matrix and identify the exact denied
      primitive or falsify the current helper-exec hypothesis. Record a root
      cause precise enough to choose a G6-preserving architecture path before
      any remediation task is opened; no credential values enter logs,
      durable state or evidence.
    outcome: >-
      DIAGNOSED. On Claude Code 2.1.277 the host and sanitized PATH+HOME+USER
      controls are authenticated and a harmless real-provider marker succeeds;
      permissive Seatbelt also succeeds, while the production-shaped profile
      exits 1 without the marker. Differential probes falsified the suspected
      randomized Bun-helper cause. The confined provider requires three
      capabilities together: mach-lookup of com.apple.SecurityServer,
      file-read-data for the login Keychain database, and exact process-exec
      of /usr/bin/security. Every one- and two-capability ablation remains red;
      all three make the marker succeed. No credential contents were read or
      recorded. That capability set is not adopted because it would expose the
      worker to the user's general login-Keychain mechanism and Seatbelt cannot
      bind /usr/bin/security argv to one Claude credential item. The selected
