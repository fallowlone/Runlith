    exit_criteria_summary: >-
      The contract states that v1 models acceptance obligations as criterion
      identities proved by automated test, names the reserved fields as
      unauthorable, and the boundary is pinned by an executable anchor. Full
      workspace verification, clippy and fmt pass.
    outcome: >-
      V1 BOUNDARY RECORDED. Investigation corrected both prior accounts:
      TASK-0089 F-03 claimed no stronger obligation is representable anywhere,
      and the independent review's R-03 replied that Task.verification and
      Task.required_review carry two obligation lists planning ignores. Neither
      holds. The fields exist and persist, but the domain exposes no setter,
      protocol v6 authoring carries only allowed_paths, acceptance_criteria and
      baseline_risk with no later edit operation, and nothing reads them, so on
      the supported control plane they are always empty. The real shape is that
      v1 models acceptance obligations as criterion identities with no proof
      method, which is why derive assigns AutomatedTest and why V9 method
      escalation has no differing input. ADR-0027 now states this, names
      IndependentReview, SecurityCheck and HumanApproval as unreachable in v1,
      records that VerificationMethod deliberately has no Ord so declaration
      order is never a strength ranking, and admits that INV-046 human-approval
      requirements are not enforced as proof obligations because v1 cannot
      express one. The typed model is deferred to G8, whose roadmap already
      names EvidenceRequirement; building a narrower version in G7 would mean a
      new IPC version and a schema migration for a model already scheduled for
      replacement. The unfalsifiable non-weakening clause from TASK-0088 is
      rewritten to apply to modelled obligations whose value the child cannot
      carry, with scope as the worked example. Pinned by
      v1_derives_every_criterion_as_automated_test. R-04..R-07 remain open and
      TASK-0087 still needs a final conformance pass.
