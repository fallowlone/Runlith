  - id: TASK-0122
    gate: G8
    title: Side-Effect Execution Protocol contract
    objective: >-
      Freeze the durable side-effect intent/recovery contract as a
      contract-only ADR, so a crash after an external effect is never
      silently retried while its outcome is unknown.
    scope: >-
      Contract only: the PREPARED, INTENT_RECORDED, EXECUTING, CONFIRMED,
      FAILED, AMBIGUOUS and RECONCILE state machine — RECONCILE resolving
      to CONFIRMED, SAFE_TO_RETRY, SAFE_TO_CONTINUE or ESCALATE — with
      typed transitions;
      idempotency identity carried by INTENT_RECORDED; AMBIGUOUS is
      distinct from FAILED and NOT_EXECUTED; RECONCILE before any retry
      whose external outcome is uncertain; provider-specific read-back and
      receipt mechanisms behind ports; explicit confirmation that durable
      relational state plus journals is sufficient (no full Event
      Sourcing, per the roadmap EVENT_SOURCING guardrail); relationship to
      the existing Git/filesystem versus SQLite failure-domain split
      (INV-145). No production code.
    exit_criteria_summary: >-
      An accepted ADR naming states, transitions, durable fields, ports and
      recovery obligations precisely enough for TASK-0126 to implement the
      workspace/Git dogfood consumer without inventing semantics.
    outcome: >-
      ACCEPTED 2026-09-21 by owner decision after three independent
      review rounds. Round 1 returned CHANGES-REQUIRED with two HIGH
      findings (the state machine could not express the proven
      TASK-0057 branch-only recovery; SE-1 in universal form made the
      existing G5 provider seam a standing violation) and three MEDIUM
      findings (ESCALATE with no legal exit; the kind registry without
      port-operation and canonical-parameter mapping; the missing
      SAFE_TO_RETRY re-entry edge), plus three LOW items. Round 2
      verified all eight resolutions and found two new items on the new
      machinery (WORKSPACE_CLEANUP without a named continuation; the
      idempotency minting rule contradicted by carry-forward); the round-3
      verification returned ACCEPTABLE. Record:
      docs/architecture/adr/ADR-0031-g8-side-effect-execution-protocol.md.
      Accepted shape: the SoT 105.2 machine refined with a documented
      SAFE_TO_CONTINUE outcome, applicability-by-registration, terminal
      ESCALATE with the intent-resolution record, a two-kind registry with
      per-kind operation and canonical-parameter tables, and explicit
      re-entry edges. Two non-blocking observations are recorded for
      TASK-0126: implement the liveness re-check as part of the cleanup
      catch-up continuation, and keep the queue state enumerations in
      sync with the ADR machine (fixed for the RECONCILE outcomes in this
      pass).
    depends_on:
      - TASK-0120
    blocked_by: []
    references:
      - AI_ENGINEERING_OS_ARCHITECTURE_SOURCE_OF_TRUTH.md
      - docs/architecture/INVARIANTS.md
      - docs/architecture/adr/ADR-0008-worktree-isolation.md
