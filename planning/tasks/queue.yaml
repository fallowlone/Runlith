  - id: TASK-0116
    gate: G7
    title: Atomicity Assessment Durability Contract Reconciliation
    objective: >-
      Remediate G7-BLOCKER-05 / historical F-07 by making the accepted
      `assess_atomicity` durability semantics coherent across ADR-0027,
      ADR-0028 and the implementation before another G7 closure re-audit.
    scope: >-
      Decide and record whether atomicity assessment may durably reserve/settle
      PlannerPort spend and advance the branch current PlanningInputSnapshot;
      make the smallest contract or implementation change required by that
      decision and add focused executable coverage. No unrelated planning
      behavior, provider-auth, G6 authority, IPC, schema, or G8 work.
    exit_criteria_summary: >-
      ADR-0027 and ADR-0028 prescribe one compatible assessment durability
      model; executable coverage pins the chosen current-input/admission
      semantics; existing planning, V9, G6 and workspace verification remains
      green. The task makes no G7_CLOSED claim; a fresh independent closure
      re-audit follows it.
    outcome: >-
      ACCEPTED. ADR-0027 and ADR-0028 now prescribe one assessment durability
      model, resolved entirely on ADR-0027's side. The decision: assessment
      keeps the crash-safe spend reservation ADR-0028 section 4 requires, and
      loses the current-input publication it never needed. ADR-0027 section 1's
      "assessment is pure, zero durable writes" clause is replaced in place,
      not merely contradicted by an appended amendment, because leaving the
      false sentence standing is exactly how this blocker survived a full gate
      audit; the clause now states that assessment writes no Plan and that
      calling it twice observes no new accepted revision and no change to the
      branch's current planning input.
      Implementation. The storage run claim and the service control-run mode
      each became an explicit three-state value (Proposal, ApprovedReplay,
      Assessment) instead of an Option that silently encoded a third case.
      Assessment's own run claim no longer writes planning_input_heads.
      Generation fencing is unchanged for all three, so every planner call is
      still fenced and its spend still reserved.
      The carve-out covers both of assessment's human gates, and getting that
      wrong was this task's own blocking defect. The first submission carved
      out only the pre-call gate. The post-call gate — reached when the
      planner call trips a bound or faults with DepthExhausted, Unplannable or
      BudgetExhausted — then bound its HumanDecision to a snapshot that was no
      longer current, so create_human_decision_request refused with
      PlanningInputStale and a designed WaitingForHuman outcome became a hard
      storage error. It was production-reachable through the shipped Claude
      planner adapter, which raises BudgetExhausted from assessment, and no
      test in the workspace covered that path. Independent review found it and
      proved it with probes against both the baseline and the candidate; the
      regression was reproduced here before being fixed. Both gates now
      publish current input through one named helper, and a run is finished
      rather than left ACTIVE if gate creation fails.
      Evidence this was a real defect and not only a contract conflict: the
      new service test atomicity_assessment_does_not_de_admit_the_accepted_
      revision was run against the previous behaviour by flipping the
      assessment mode back to Proposal, and it failed with the intended
      message; it passes on the shipped code.
      Coverage. Four tests: the storage claim binds its own snapshot without
      replacing current input and still advances the generation and takes over
      the run head (ADR-0028 section 3); an assessment with different evidence
      leaves an accepted revision admissible; a faulting assessment opens a
      human gate whose bound snapshot is current, which is what makes the
      decision resumable; and a superseded run cannot republish its snapshot.
      Spend reservation was already pinned by the pre-existing
      bounded-call-budget test. Known coverage limit: the pre-call gate's
      publication is exercised only indirectly.
      A second review round found two stale sentences this task had introduced
      into the very ADR it was correcting - a claim that section 1's clause was
      replaced when round two had restored it under a blockquote, and a
      forward reference to coverage "named below" that named nothing. Both are
      fixed; the amendment now lists the four tests by name. The same round
      found that publish_planning_input, the one writer of planning_input_heads
      not fused into a run claim, had no generation fence: a superseded run
      could republish its stale snapshot. It now verifies the run generation
      inside the same immediate transaction as the write, and refuses a
      snapshot the run is not bound to. Residual, disclosed rather than fixed
      and queued as TASK-0119: the gate still publishes and creates its
      decision in two transactions, so a crash between them leaves the pointer
      moved with no gate recorded, and that state is recoverable only by
      producing a new accepted revision - restart alone does not heal it,
      because the stranded revision's bound snapshot never becomes current
      again. The realistic in-flight race is already caught earlier by
      ensure_current_run. This is not deferred to avoid work: the same window
      already exists on the pre-call gate, which has published in one
      transaction and created in another since before this task, so fixing
      only the post-call gate would leave the two inconsistent, and closing it
      properly changes the human-decision store's write contract for a
      planning-store concern.
      ADR-0027 section 1's original clause is preserved and corrected beneath
      it with a "Corrected by" blockquote, matching the existing precedent at
      ADR-0028 line 240. The first submission deleted the sentence instead, on
      a stated premise that the repo had no such precedent; that premise was
      simply wrong, and review corrected it.
      Verification: cargo test --workspace --locked --no-fail-fast 1101 passed
      / 3 ignored, up from 1097 by exactly the four new tests; clippy
      --workspace --all-targets --locked -D warnings clean; fmt --all clean.
      completed_through advances to TASK-0118: TASK-0116 was the last open
      item below it, and TASK-0117 and TASK-0118 are already accepted. Product
      identity advances to TASK-0116 per VERSIONING.md, which keys identity on
      the task responsible for the current state rather than on numeric order.
      G7 remains IN_PROGRESS and this task makes no G7_CLOSED claim: the
      blocker is remediated, but a fresh independent closure re-audit has not
      run, and that audit is what would close the gate.
    depends_on:
      - TASK-0115
    blocked_by: []
    references:
      - docs/development/G7_TASK_0115_FINAL_CLOSURE_REAUDIT.md
      - docs/architecture/adr/ADR-0027-g7-planning-orchestration-contract.md
      - docs/architecture/adr/ADR-0028-g7-planning-input-run-and-execution-fencing.md
      - crates/app-services/src/planning_service.rs
      - adapters/storage-sqlite/src/planning_control_store.rs

  - id: TASK-0117
    gate: G7
    title: Provider Auth Confinement Preflight Portability and Honest Smoke Naming
    objective: >-
      Remove the silent platform assumption in the TASK-0114 provider
      authentication preflight, and stop the production real-provider smoke
      from carrying a name that asserts the opposite of what it verifies.
    scope: >-
      The shared agentd provider-launch preflight and its own test module in
      bins/agentd/src/execution.rs. Bind the confinement-auth decision to the
      same platform selection that chooses the production isolation backend,
      and add platform-neutral coverage that fails when a new confining
      backend is added without answering the provider-auth question. Rename
      the inverted smoke to state its actual assertion. No Seatbelt widening,
      no credential brokering, no scheduler/port contract change, no ADR
      change, and no change to the refusal behaviour itself.
    exit_criteria_summary: >-
      The confinement refusal and the production isolation backend are
      selected by one paired platform decision rather than two independent
      cfg sites; a platform-neutral test fails if a platform enforces
      mandatory confinement without a stated provider-auth compatibility
      answer; the real-provider smoke name matches its assertion; existing
      TASK-0114 refusal behaviour, G6 isolation and provider fixture paths
      remain green.
    outcome: >-
      ACCEPTED after one REQUEST_CHANGES round. The production isolation
      backend and the provider-auth verdict now live in one cfg-selected
      production_platform module in bins/agentd/src/execution.rs, and the
      preflight call site is platform-neutral, which also stops
      PROVIDER_AUTH_CONFINEMENT_UNSUPPORTED from becoming dead code on
      non-macOS builds. The verdict is a three-state ConfinementAuthVerdict
      (NoMandatoryConfinement / Compatible / Unsupported) rather than an
      Option, so a confining platform must choose between compatible and
      unsupported instead of inheriting an absent answer that would permit the
      launch. The inverted keeper is renamed to
      real_claude_refuses_before_provider_work_under_production_g6_confinement
      so its name states the assertion it makes. TASK-0114 refusal behaviour
      is byte-identical on macOS and unchanged elsewhere.
      First submission was rejected by independent review: it promised
      platform-neutral drift coverage in scope and exit criteria, shipped none,
      and recorded ACCEPTED anyway, and its module doc claimed a drift
      guarantee the type system does not provide. Both are fixed here.
      production_confinement_and_provider_auth_verdict_stay_paired asserts the
      stated verdict against the backend's reported EnforcementAxes rather than
      against the shape of the cfg, so it also catches a confining backend
      introduced without editing this module. Its RED state was demonstrated by
      temporarily setting the macOS verdict to NoMandatoryConfinement, which
      failed with the intended message before being reverted. The module doc
      now states co-location is a review aid, not an enforced coupling, and
      names the test as the actual guard. docs/architecture/runners.md section
      6 records the invariant so it is discoverable outside the source. The
      guard's own limit is documented with it: it compares presence of
      confinement against presence of a verdict, never the verdict's continued
      truth, so a stale verdict or a backend selected at runtime rather than by
      cfg would still pass.
      Known limitations carried forward, not fixed here: no executable evidence
      exists that a real provider can complete work under production G6
      confinement, because TASK-0114 refuses that configuration by design, so
      the success path stays uncovered until confinement-compatible provider
      authentication exists; and non-macOS runtime behaviour remains verified
      only statically, because this host is macOS and cross-checking the
      non-macOS arm fails in the libsqlite3-sys C cross-build for reasons
      unrelated to this change. A Linux or Windows CI job would settle it.
      Verification: cargo test -p agentd (71 passed, 1 ignored), cargo test -p
      runner -p runner-macos-seatbelt -p runner-native -p provider-claude -p
      product-version (135 passed, 1 ignored), cargo clippy --workspace
      --all-targets -D warnings clean, cargo fmt --check clean.
      completed_through remains TASK-0115 because TASK-0116 (G7-BLOCKER-05 /
      F-07) is still open; product identity advances to TASK-0117 and G7
      remains IN_PROGRESS. Historical G6/G7 audit records citing the old test
      name are left unedited as dated run logs; the one live reproduction
      recipe in the TASK-0112 diagnosis was updated to state that TASK-0114
      made that receipt unreproducible.
    depends_on:
      - TASK-0114
    blocked_by: []
