  - id: TASK-0151
    gate: G8
    title: Candidate evidence hardening follow-ups (TASK-0144 deferred findings)
    objective: >-
      Remediate the hardening findings that TASK-0144's independent reviews
      deferred, closing residual gaps in the ADR-0035 candidate-input
      evidence producer's storage, audit and IPC boundaries without
      widening its evidence scope or granting it completion authority.
    scope: >-
      No BEFORE DELETE trigger guards candidate operation rows;
      append_candidate_result does not check invalidation before writing;
      get_observed_effect can read an invalidated candidate result by
      effect id; the evidence read and its invalidation check are separate,
      non-atomic statements; status_history has an 8192-byte cap that can
      be exceeded under repeated failures; there is no store-level binding
      of an assessment to its selection; policy_fingerprint is checked for
      format only, not reconciled against the current Policy; repository-
      local config rejection (includes, fsmonitor) is only partial;
      per-descriptor G6 audit volume during scans is unbounded; interior
      `.` path components are not rejected; the pinned Git accepts a
      symlinked parent directory; there is no independent fault-injection
      test for scan-time G6 failures (a defense-in-depth layer); the
      operator IPC VerificationSucceeded path ignores candidate evidence;
      and migration 0022 was edited in place, so dev databases created at
      the pre-fix branch head are inconsistent with it. No change to
      TASK-0144's evidence-only production evaluation, permanent
      invalidation or fail-closed scan guarantees.
    exit_criteria_summary: >-
      Each listed finding is either resolved with a focused regression test
      or explicitly re-deferred with a recorded rationale; no finding
      regresses TASK-0144's evidence-only production evaluation, permanent
      invalidation or fail-closed scan guarantees; full workspace
      verification and independent security review green.
    depends_on:
      - TASK-0144
    blocked_by: []
    references:
      - docs/architecture/adr/ADR-0035-g8-immutable-git-candidate-proposal.md
    outcome: >-
      Implemented on branch task-0151-evidence-hardening. Storage batch
      (migration 0024, schema 24): finding 1 BEFORE DELETE trigger on
      candidate_input_operations; finding 2 invalidation check inside the
      append transaction; findings 3+4 invalidated results unreadable
      through get_observed_effect / get_candidate_evidence_for_completion
      with atomic read+invalidation; finding 5 status_history 8192-byte
      CHECK retained with a regression test; finding 6 assessment-requires-
      selection trigger; finding 14 IF NOT EXISTS repair of the 0022-drifted
      operations shape plus fail-closed recreate directive for pre-column
      assessment shapes (no fabricated evidence). Producer batch: finding 7
      CandidateSelector::from_requirement_under_policy reconciles the
      requirement pin against the current policy (evaluator carries the
      composition-derived fingerprint, None fails closed); finding 10
      FileScope refuses non-lone interior "." spellings; finding 11 pinned
      gitdir canonicalizes and re-checks the anchor (lexical path kept for
      back-reference comparison); finding 13 operator IPC
      VerificationSucceeded refuses candidate-routed tasks (completion only
      through the revalidating production cycle); finding 12 mid-scan G6
      fault-injection test proves abort-without-partial-snapshot at every
      denial position. Findings 8 (repo-local config surface matrix) and 9
      (per-descriptor audit volume, ~130K rows worst case) explicitly
      re-deferred to TASK-0163/TASK-0164: both need G6-side design, not a
      hardening-task pattern tweak. Every fix RED-first; production order
      (selection before result) verified before enforcing the trigger;
      completion_admission seeds updated to the producer order. Full
      workspace verification green (127 suites, EXIT=0). Integration into
      main is not claimed.

