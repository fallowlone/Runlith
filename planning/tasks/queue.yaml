  - id: TASK-0051
    gate: G5
    title: G5 Entry-Atomicity Remediation
    objective: Make the execution entry boundary atomic so concurrent
      identity races and slug collisions refuse before the first durable
      mutation. Make preflight plus claim plus start plus create_execution
      one atomic commit (single Immediate transaction or equivalent
      serialization) so a concurrent duplicate execution or attempt
      identity leaves the loser Task in its pre-run state with zero
