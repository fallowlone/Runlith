# Canonical development roadmap: gate sequence / macro plan.
# Authority: Architecture / ADRs / invariants > roadmap > task queue.
# The roadmap never overrides architecture; on disagreement, architecture wins.
# Gate progression follows exit criteria, never calendar dates.
# NOTE: status values below (in_progress / blocked / planned) are
# planning-document metadata only. They are NOT Task.status lifecycle
# states (see docs/architecture/task-engine.md) and change nothing there.
# Near-term work lives in planning/tasks/queue.yaml, not here.

schema_version: 1
current_gate: G6
task_queue: planning/tasks/queue.yaml

gates:
  - id: G0
    name: Architecture Freeze
    status: completed
    objective: Freeze architecture before production implementation.
    exit_criteria_ref: docs/development/G0_AUDIT.md
    scope_ref: AI_ENGINEERING_OS_ARCHITECTURE_SOURCE_OF_TRUTH.md

  - id: G1
    name: Tauri <-> agentd
    status: completed
    objective: Local control channel only (start, handshake, ping, version
      negotiation, reconnect, shutdown) plus the six failure-matrix tests.
    scope_ref: docs/architecture/ipc.md

  - id: G2
    name: Task Core
    status: completed
    objective: Project, Task, Dependency, state machine, SQLite, Event
      Journal, agentctl. No AI.
    scope_ref:
      - docs/architecture/task-engine.md
      - docs/architecture/events.md

  - id: G3
    name: FakeAgent Runtime
    status: completed
    objective: Full Task -> Scheduler -> FakeAgent -> Submit -> Verify flow.
    scope_ref: docs/architecture/fake-agent.md

  - id: G4
    name: Workspace/Git
    status: completed
    objective: Worktrees, branches, diff, cleanup, failure modes.
    scope_ref: docs/architecture/adr/ADR-0008-worktree-isolation.md

  - id: G5
    name: First real provider
    status: completed
    objective: One provider passes the AgentProvider contract; the second
      must add cleanly without core changes.
    scope_ref: docs/architecture/providers.md

  - id: G6
    name: Security
    status: completed
    objective: Policy Engine, approvals, Secret Broker, audit, runner
      security levels.
    research_backed_followups:
      - Explicit EXPLAIN / PROPOSE / EXECUTE execution modes with immutable
        ActionProposal and approval bound to the exact proposal hash.
      - Task-scoped Capability Leases with principal/scope/TTL binding and
        canonical DENY-attempt audit evidence.
    note: >-
      Historical placement (pre-G6-closure; TASK-0065 through TASK-0068
      are complete and G6 is CLOSED). These items are not G6 work:
      re-home them to new tasks when scheduled, and reconcile
      ActionProposal / CapabilityLease vocabulary with
      HumanDecisionRequest / Council / Procedures before implementing.
    scope_ref:
      - docs/architecture/adr/ADR-0013-policy-engine-os-isolation.md
      - docs/architecture/adr/ADR-0026-g6-security-authority-and-capability-contracts.md
      - docs/security/POLICY_CONTRACT.md

  - id: G7
    name: Multi-agent DAG + bounded adaptive planning
    status: planned
    objective: Planner/Worker/Reviewer with typed messages, versioned plan
      revisions, PlannerPort, atomicity proposals, recursion guardrails.
    planned_capabilities:
      - Bidirectional Human Handoff with HandoffPacket, ResumeToken and explicit
        RESUME / REPLAN / TAKEOVER / ABORT continuation decisions.
      - >-
        Adaptive Collaboration Topology: multi-perspective work for ambiguity
        and independent review; one bounded worker for converged execution.
      - ActionProposal lifecycle integration for proposed mutations before
        execution authority is consumed.
    scope_ref: AI_ENGINEERING_OS_ARCHITECTURE_SOURCE_OF_TRUTH.md

  - id: G8
    name: Verification
    status: planned
    objective: Tests/review/security/acceptance pipeline.
    planned_capabilities:
      - Observed Effect / Claim Verification contract separating AgentClaim,
        EvidenceRequirement, ObservedEffect and ClaimVerification.
      - Side-Effect Execution Protocol with durable intent, AMBIGUOUS recovery
        and RECONCILE before any retry whose external outcome is uncertain.
    scope_ref: AI_ENGINEERING_OS_ARCHITECTURE_SOURCE_OF_TRUTH.md

  - id: G9
    name: Context Engine + Continuity
    status: planned
    objective: Retrieval, token budget, context plans, epochs, checkpoints,
      history search.
    planned_capabilities:
      - Context Provenance Envelope carrying source/time/type/sensitivity,
        permission scope, confidence and supersession metadata.
      - Conditional Entity Graph only when entity ambiguity or relationship-heavy
        retrieval measurably justifies graph-assisted resolution.
    scope_ref:
      - docs/architecture/adr/ADR-0010-context-derived-state.md
      - docs/architecture/adr/ADR-0011-provider-independent-context-continuity.md

  - id: G10
    name: Memory Engine
    status: planned
    objective: Structured memory with provenance and lifecycle.
    scope_ref: docs/architecture/adr/ADR-0012-structured-memory-provenance.md

  - id: G11
    name: Background daemon
    status: planned
    objective: Authorized work continues with UI closed.
    scope_ref: AI_ENGINEERING_OS_ARCHITECTURE_SOURCE_OF_TRUTH.md

  - id: G12
    name: Remote Worker
    status: planned
    objective: Device identity, outbound worker connection, remote execution.
    scope_ref: AI_ENGINEERING_OS_ARCHITECTURE_SOURCE_OF_TRUTH.md

  - id: G13
    name: Cloud/Team
    status: planned
    objective: Account, billing, encrypted sync, teams, org policies.
    scope_ref: AI_ENGINEERING_OS_ARCHITECTURE_SOURCE_OF_TRUTH.md

future_product_engineering_spikes:
  - id: UI-TECHNOLOGY-SPIKE
    status: deferred
    trigger: After the first serious desktop UI exists and can serve as a
      representative implementation baseline.
    objective: Compare Tauri 2 + React/TypeScript, Slint, and GPUI by
      implementing the same representative Task Detail / Execution workspace.
    evaluate:
      - startup time
      - idle/runtime memory
      - render/scroll performance on large lists and logs
      - accessibility
      - multi-window support
      - keyboard-first UX
      - terminal/diff/code rendering suitability
      - drag-and-drop
      - native OS integration
      - security boundary implications
      - IPC integration with separate Rust agentd
      - development velocity
      - testing/tooling maturity
      - cross-platform support
      - maintainability
      - migration cost/risk
      - framework maturity/stability
    outcome: Evidence-based recommendation to keep Tauri, migrate to Slint,
      migrate to GPUI, or defer the decision.
    constraints:
      - This spike is deferred future product-engineering work and does not
        change the current gate or task queue priority.
      - The spike does not authorize or perform a migration automatically.
      - The UI shell remains replaceable; agentd, control-plane, and domain
        logic remain independent behind versioned IPC.

roadmap_guardrails:
  - id: DOGFOOD_DETACHMENT
    priority: P1
    rule: Every major capability must produce independently useful, verifiable
      dogfood value before the next dependent capability is required.
    test: If the rest of Runlith were removed, the capability should still be
      useful and testable within its stated boundary.
  - id: VERIFIED_DELIVERY_COST
    decision: unchanged
    note: Community evidence about token compression supports the existing
      multi-objective Verified Delivery Cost model; no formula change.
  - id: EVENT_SOURCING
    decision: future_only
    note: Full Event Sourcing remains outside v1; side-effect recovery uses
      durable intent/journal/reconciliation contracts instead.
  - id: ENTITY_GRAPH
    decision: conditional
    note: Graph support is an optional retrieval tool, never a core runtime
      dependency by default.
